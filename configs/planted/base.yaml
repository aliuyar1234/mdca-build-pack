setting:
  id: planted
  variant: base
  description: Base scaffold config for the planted S1 setting.
paths:
  results_dir: results
  artifacts_dir: artifacts
method:
  bootstrap_n_reps: 1000
  null_bin_width_bits: 2
  null_min_family_count: 5
  frontier_balance_seed: 0
seeds:
  global: 0
  dataset: 0
  model_init: 0
  candidate_search: 0
  bootstrap: 0
runtime:
  device: cpu
  dtype: float32
  num_workers: 0
extras:
  phase: score_only
  setting_scope: S1
  candidate_pool:
    high_level_models:
      - H_true_other
      - H_first
      - H_second
      - H_rep
    site_budgets:
      - 1
      - 2
      - 4
    map_families:
      linear_dense:
        - default_dense
      linear_sparse_l1:
        - 1.0e-4
        - 1.0e-3
        - 1.0e-2
      linear_lowrank:
        - 4
        - 8
        - 16
      mlp1_relu:
        - 32
        - 64
        - 128
  training:
    linear_epochs: 40
    mlp_epochs: 60
    learning_rate: 0.05
